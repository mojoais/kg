  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;--bg:#101a24;--ink:#f4f2ec;--green:#14543f;--muted:#aeb9c2}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(28px,6vw,88px);width:min(1120px,calc(100% - 64px));margin:auto;padding:56px 0}

    .dot{width:7px;height:7px;border-radius:50%;background:#8bbba7;flex:none}

    .cta:hover{transform:translateY(-2px);background:#dce7e2}
    .cta svg{width:18px;height:18px}
    .art{min-height:520px;display:grid;place-items:center;position:relative}
    .art:before{content:"";position:absolute;width:min(40vw,460px);aspect-ratio:1;border:1px solid #ffffff16;border-radius:50%;box-shadow:0 0 0 34px #ffffff08,0 0 0 68px #ffffff05}
    .table{width:min(100%,390px);aspect-ratio:.78;position:relative;overflow:hidden;border:8px solid #26333c;border-radius:190px 190px 28px 28px;transform:rotate(-5deg);background:radial-gradient(ellipse at 48% 35%,#28795d 0%,#16533f 48%,#0b3026 100%);box-shadow:0 35px 85px #0008,inset 0 0 0 1px #ffffff26}
    .table:before{content:"";position:absolute;inset:17px;border:1px solid #ffffff35;border-radius:170px 170px 18px 18px}
    .table:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 3px,#ffffff05 3px 4px);pointer-events:none}
    .card{position:absolute;z-index:1;width:27%;height:37%;top:29%;background:#f1eee5;color:#17202a;border-radius:7px;box-shadow:0 18px 28px #0004;padding:10px;font-family:Georgia,serif}
    .card b{display:block;font-size:clamp(20px,2.5vw,29px);line-height:1}
    .card .suit{font-size:clamp(20px,2.2vw,27px)}
    .card .big{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(48px,6vw,66px)}
    .c1{left:26%;transform:rotate(-12deg)}
    .c2{left:48%;top:27%;transform:rotate(9deg);color:#8c3038}
    .chips{position:absolute;z-index:2;width:68px;aspect-ratio:1;border-radius:50%;border:5px solid #34434c;background:repeating-conic-gradient(#b6c0c5 0deg 10deg,#29343d 10deg 20deg);box-shadow:0 12px 20px #0005}
    .chips:after{content:"";position:absolute;inset:10px;border:2px solid #b6c0c5;border-radius:50%;background:#273640;box-shadow:inset 0 0 0 5px #273640,inset 0 0 0 6px #aebbc1}
    .ch1{left:17%;bottom:19%}.ch2{left:31%;bottom:15%;transform:scale(.82)}.ch3{right:15%;bottom:21%;transform:scale(.9)}
    @media(max-width:760px){
